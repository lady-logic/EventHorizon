name: 🛡️ SonarCloud + CodeGuardian

on:
  pull_request:
    branches: [ main, master ]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install SonarCloud Scanner
        run: dotnet tool install --global dotnet-sonarscanner
      - name: SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin /k:"lady-logic_EventHorizon" /o:"lady-logic" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          dotnet build EventHorizon.sln
          dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  codeguardian:
    name: 🤖 CodeGuardian AI Review
    runs-on: ubuntu-latest
    needs: sonarcloud
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Checkout CodeGuardian
        uses: actions/checkout@v4
        with:
          repository: lady-logic/CodeGuardian
          path: codeguardian

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build CodeGuardian
        run: dotnet build codeguardian/src/CodeGuardian.Analyzer/CodeGuardian.Analyzer/CodeGuardian.Analyzer.csproj

      - name: Run CodeGuardian
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: dotnet run --project codeguardian/src/CodeGuardian.Analyzer/CodeGuardian.Analyzer/CodeGuardian.Analyzer.csproj -- ${{ vars.SONAR_PROJECT_KEY }}